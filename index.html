<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1280,height=720">

<title>ありがとうございました</title>

<style>

@font-face{
    font-family:'Panda';
    src:url('pandabakery.ttf');
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{

    width:1280px;
    height:720px;

    overflow:hidden;

    position:relative;

    font-family:'Panda',sans-serif;

    background:#fff3dc;
}

/* 背景 */

.bg{

    position:absolute;

    inset:0;

    width:100%;
    height:100%;

    object-fit:cover;

    z-index:-2;
}

/* キラキラ */

.sparkle{

    position:absolute;

    opacity:0.75;

    animation:
    sparkle 3s infinite ease-in-out;
}

.star{

    width:22px;
    height:22px;

    background:#fff0a8;

    clip-path:polygon(
    50% 0%,
    61% 35%,
    98% 35%,
    68% 57%,
    79% 91%,
    50% 70%,
    21% 91%,
    32% 57%,
    2% 35%,
    39% 35%
    );

    box-shadow:
    0 0 16px rgba(255,220,100,0.55);
}

.diamond{

    width:18px;
    height:18px;

    background:#fff0a8;

    transform:rotate(45deg);

    box-shadow:
    0 0 16px rgba(255,220,100,0.55);
}

.s1{
    top:90px;
    left:120px;
}

.s2{
    top:180px;
    right:180px;

    animation-delay:1s;
}

.s3{
    bottom:120px;
    left:220px;

    animation-delay:2s;
}

.s4{
    bottom:140px;
    right:240px;

    animation-delay:1.5s;
}

/* 全体 */

.container{

    width:100%;
    height:100%;

    display:flex;

    flex-direction:column;

    align-items:center;

    padding-top:24px;
}

/* 上ロゴ */

.event-logo{

    width:300px;

    margin-bottom:18px;

    filter:
    drop-shadow(0 10px 24px rgba(0,0,0,0.10));
}

/* カード */

.card{

    width:1040px;

    height:470px;

    background:
    rgba(255,255,255,0.90);

    border:
    6px solid #f6b7c9;

    border-radius:42px;

    box-shadow:
    0 20px 50px rgba(255,190,60,0.10);

    display:flex;

    flex-direction:column;

    align-items:center;

    justify-content:center;

    position:relative;

    padding:
    40px
    80px;

    text-align:center;

    overflow:hidden;
}

/* タイトル */

.title{

    font-size:66px;

    line-height:1.1;

    color:#ffadc3;

    text-shadow:
    0 4px 0 #fff,
    0 0 10px rgba(255,220,120,0.14);

    margin-bottom:26px;
}

/* 本文 */

.message{

    font-size:42px;

    line-height:1.55;

    color:#7b4b35;

    text-shadow:
    0 3px 0 #fff;
}

/* ピンク */

.pink{

    color:#ffadc3;

    text-shadow:
    0 3px 0 #fff,
    0 0 8px rgba(255,220,120,0.10);
}

/* 下ロゴ */

.cafe-logo{

    position:absolute;

    bottom:28px;

    width:170px;

    opacity:0.95;

    filter:
    drop-shadow(0 6px 12px rgba(0,0,0,0.10));
}

/* アニメ */

.fade{

    opacity:0;

    transform:
    translateY(16px);

    animation:
    fadeUp 1s ease forwards;
}

.delay1{
    animation-delay:0.4s;
}

.delay2{
    animation-delay:1.2s;
}

.delay3{
    animation-delay:2s;
}

@keyframes fadeUp{

    from{
        opacity:0;
        transform:
        translateY(18px);
    }

    to{
        opacity:1;
        transform:
        translateY(0);
    }
}

@keyframes sparkle{

    0%{
        transform:
        scale(0.7);

        opacity:0.35;
    }

    50%{
        transform:
        scale(1.3);

        opacity:1;
    }

    100%{
        transform:
        scale(0.7);

        opacity:0.35;
    }
}

</style>
</head>

<body>

<!-- 背景 -->

<img
src="haikei.png"
class="bg"
>

<!-- キラキラ -->

<div class="sparkle star s1"></div>
<div class="sparkle diamond s2"></div>
<div class="sparkle star s3"></div>
<div class="sparkle diamond s4"></div>

<div class="container">

    <!-- 推し犬ロゴ -->

    <img
    src="wan_logo.png"
    class="event-logo fade delay1"
    >

    <!-- カード -->

    <div class="card fade delay2">

        <div class="title">
            ありがとうございました！
        </div>

        <div class="message">

            わんも～推し犬総選挙を<br>
            盛り上げてくださり<br>
            本当にありがとうございました！<br><br>

            商品は
            <span class="pink">
                6月中に順次販売予定
            </span>
            です!!<br><br>

            これからも引き続き<br>
            <span class="pink">
                わんも～Cafe
            </span>
            をよろしくお願いします。

        </div>

        <!-- わんも～Cafeロゴ -->

        <img
        src="wanmow_logo.png"
        class="cafe-logo fade delay3"
        >

    </div>

</div>

</body>
</html>
